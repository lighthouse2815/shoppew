name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: true
          vulnerability-check: true

  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android compile SDK 36
        if: matrix.language == 'java-kotlin'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build Java and Kotlin for CodeQL
        if: matrix.language == 'java-kotlin'
        run: |
          chmod +x backend/mvnw mobile/android/gradlew
          backend/mvnw -B -ntp -f backend/pom.xml -DskipTests package
          mobile/android/gradlew --no-daemon --stacktrace -p mobile/android assembleDebug

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  trivy:
    name: Trivy / source, secrets, image, SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan source dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Build immutable backend image
        run: docker build --tag shoppew-backend:${{ github.sha }} backend

      - name: Scan backend runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shoppew-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          skip-setup-trivy: true

      - name: Generate CycloneDX image SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shoppew-backend:${{ github.sha }}
          format: cyclonedx
          output: shoppew-backend-sbom.cdx.json
          skip-setup-trivy: true

      - name: Retain backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: shoppew-backend-sbom-${{ github.sha }}
          path: shoppew-backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
